name: Release

# Fires on a bare version tag — 1.0.9, not v1.0.9. The pattern is GitHub's filter syntax,
# where `+` means "one or more of the preceding character", so [0-9]+ is a run of digits.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write       # create the release and upload its assets
  id-token: write       # mint the OIDC token the attestation is signed with
  attestations: write   # write the attestation itself — without this the step fails with
                        # "Resource not accessible by integration", which reads like a
                        # repository setting rather than a missing scope

# Never cancel a publish half-way. Two runs for the same tag would be a mistake worth
# seeing rather than silently discarding.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # CI does not run on tags, so without this nothing verifies the commit being
      # published. A tag can be placed on any commit, including one that never went
      # through a pull request.
      - name: Test
        run: npm test

      # `npm run build` typechecks first, then bundles. The assets attached below are built
      # here from source rather than taken from the committed main.js, so what ships is
      # what this commit produces.
      - name: Build plugin
        run: npm run build

      # ── Artifact Attestation ────────────────────────────────────────────────
      # Cryptographically proves main.js and styles.css were built from this
      # repository's source code at this exact commit.
      - name: Attest main.js
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: styles.css

      # ── Publish the release ─────────────────────────────────────────────────
      # Notes come from the block in CHANGELOG.md between this version's heading and the
      # next, so keep those headings in the `## [x.y.z] - date` form.
      #
      # Done with the `gh` CLI, which is preinstalled on the runner, rather than an action.
      # The tag usually already carries a release, because the easiest way to create a tag
      # in the web UI is "Draft a new release". 1.0.9 shipped with an empty title and empty
      # body for exactly that reason: the action used before this uploaded the assets and
      # left the existing release's metadata untouched, and the run went green. Creating
      # and editing are separate commands here, so which one is needed is decided out loud
      # instead of depending on an action's behaviour with a release it did not create.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > notes.md

          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no '## [${TAG}]' section, so the release would ship with empty notes."
            exit 1
          fi

          TITLE="Special Callouts ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for ${TAG}; updating its title and notes."
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md
          else
            echo "Creating release for ${TAG}."
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md
          fi

          gh release upload "$TAG" main.js styles.css manifest.json --clobber

          # Assert rather than assume: a green run that published nothing readable is the
          # failure this step exists to prevent.
          if [ -z "$(gh release view "$TAG" --json body --jq '.body' | tr -d '[:space:]')" ]; then
            echo "::error::The release body is still empty after publishing."
            exit 1
          fi

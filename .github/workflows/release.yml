name: Release

# Fires on a bare version tag — 1.0.9, not v1.0.9. The pattern is GitHub's filter syntax,
# where `+` means "one or more of the preceding character", so [0-9]+ is a run of digits.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write       # create the release and upload its assets
  id-token: write       # mint the OIDC token the attestation is signed with
  attestations: write   # write the attestation itself — without this the step fails with
                        # "Resource not accessible by integration", which reads like a
                        # repository setting rather than a missing scope

# Never cancel a publish half-way. Two runs for the same tag would be a mistake worth
# seeing rather than silently discarding.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # CI does not run on tags, so without this nothing verifies the commit being
      # published. A tag can be placed on any commit, including one that never went
      # through a pull request.
      - name: Test
        run: npm test

      # `npm run build` typechecks first, then bundles. The assets attached below are built
      # here from source rather than taken from the committed main.js, so what ships is
      # what this commit produces.
      - name: Build plugin
        run: npm run build

      # ── Artifact Attestation ────────────────────────────────────────────────
      # Cryptographically proves main.js and styles.css were built from this
      # repository's source code at this exact commit.
      - name: Attest main.js
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: styles.css

      # ── Extract release notes from CHANGELOG.md ─────────────────────────────
      # Reads the block between this version's heading and the next one. Keep the changelog
      # headings in the `## [x.y.z] - date` form or this quietly produces empty notes.
      - name: Extract release notes for this version
        id: extract_notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)

          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section, so the release would ship with empty notes."
            exit 1
          fi

          # Store multiline output safely
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── Create GitHub Release ───────────────────────────────────────────────
      # Updates the release in place when one already exists for the tag, which is what
      # happens when the tag is created through "Draft a new release" in the web UI.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Special Callouts ${{ github.ref_name }}"
          body: ${{ steps.extract_notes.outputs.notes }}
          files: |
            main.js
            styles.css
            manifest.json
          fail_on_unmatched_files: true

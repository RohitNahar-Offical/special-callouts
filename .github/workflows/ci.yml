name: CI

# Catches broken pushes and pull requests. Until this existed, nothing verified a change
# until a release tag was pushed — and esbuild does not typecheck, so type errors could
# ship in a working build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: node esbuild.config.mjs production

      # main.js is committed so BRAT and manual installs work straight from the repo.
      # If a rebuild changes it, someone edited the source without rebuilding.
      - name: Verify the committed build matches source
        run: |
          if ! git diff --quiet -- main.js; then
            echo "::error::main.js is out of date — run 'npm run build' and commit the result."
            git diff --stat -- main.js
            exit 1
          fi
